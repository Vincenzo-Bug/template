name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: service_test
          POSTGRES_USER: service_test
          POSTGRES_PASSWORD: service_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U service_test -d service_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SERVICE_ENVIRONMENT: test
      SERVICE_DATABASE_URL: postgresql+asyncpg://service_test:service_test_only@127.0.0.1:5432/service_test
      SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://service_test:service_test_only@127.0.0.1:5432/service_test
      SERVICE_REDIS_URL: redis://127.0.0.1:6379/0
      SERVICE_LOG_JSON: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked project
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked --all-extras --python 3.13

      - name: Check formatting
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r app

      - name: Dependency audit
        run: uv run pip-audit

      - name: Build documentation
        run: uv run mkdocs build --strict

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container images
        run: docker compose build

      - name: Start and verify Compose stack
        run: docker compose up --wait --wait-timeout 120 api

      - name: Probe liveness and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
